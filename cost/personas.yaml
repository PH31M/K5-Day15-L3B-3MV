# Mô phỏng chi phí khi dùng thật — Nhóm 3MV · Track E (E3). Guide bước 4.2.
# Mọi số có nguồn hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng ví hoạt động / tháng — 3 kịch bản
  low: 10000
  base: 50000
  high: 200000
  source: "(tự ước tính) thấp = 10.000, cùng quy mô giả định ở spec.md §2; cơ sở = 50.000 và cao = 200.000 là giả định mở rộng, chưa có nguồn công khai"

personas:           # share lấy từ khảo sát câu 6 (tần suất 3 tháng qua); share cộng lại = 1
  - name: dung_it
    share: 0.75
    uses_per_month: 0.2
    turns_per_session: 1
    source: "share: khảo sát n=40 câu 6, 30/40 chọn 0 lần (19) hoặc 1 lần trong 3 tháng (11), xem evidence/survey/results.csv. uses_per_month = 0,2 theo spec.md §2 (tự ước tính, cao hơn mức quy đổi từ khảo sát khoảng 0,12). turns_per_session (tự ước tính)"
  - name: dung_vua
    share: 0.15
    uses_per_month: 1.5
    turns_per_session: 2
    source: "share: khảo sát n=40 câu 6, 6/40 chọn 1-2 lần/tháng. uses_per_month = điểm giữa khoảng 1-2 (tự ước tính). turns_per_session (tự ước tính)"
  - name: dung_nhieu
    share: 0.10
    uses_per_month: 3.5
    turns_per_session: 3
    source: "share: khảo sát n=40 câu 6, 4/40 chọn từ 3 lần/tháng trở lên. uses_per_month = 3,5 cho nhóm từ 3 lần trở lên (tự ước tính). turns_per_session (tự ước tính)"
# Câu 6 đếm số lần gặp giao dịch bất thường / tin nhắn nghi lừa đảo, không đếm số phiên chat.
# Dùng nó làm uses_per_month là giả định mỗi lần gặp thành một phiên chat, nên chi phí tính ra nghiêng về cận trên.
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token, gói trả phí chuẩn
  - model: openai/gpt-4.1-mini
    input: 0.40
    output: 1.60
    source: "https://openrouter.ai/api/v1/models · xem 28/11/2026 (model đã chạy eval lượt 1)"
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing và https://openrouter.ai/api/v1/models · xem 28/11/2026 (tầng nhỏ)"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing và https://openrouter.ai/api/v1/models · xem 28/11/2026 (tầng lớn)"

usd_to_vnd:
  rate: 25687
  source: "Tỷ giá trung tâm NHNN ngày 27/11/2026 theo báo https://thitruongtaichinhtiente.vn/ngay-27-11-ty-gia-trung-tam-tang-11-dong-87350.html · xem 28/11/2026"
